services:
  db:
    image: postgres:16-alpine
    container_name: spa-inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spa_inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spa_inventory"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  api:
    image: spa-inventory-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spa-inventory-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/spa_inventory?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
